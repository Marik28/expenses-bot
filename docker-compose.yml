volumes:
  db:
  logs:
  bot:
  redis:

services:

  db:
    image: postgres:12
    restart: always
    volumes:
      - db:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=Asia/Almaty
    ports:
      - ${POSTGRES_PORT}:5432

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis:/data
    ports:
      - ${REDIS_PORT}:6379

  bot:
    build: .
    depends_on:
      - db
      - redis
    env_file: .env
    environment:
      - TZ=Asia/Almaty
      - REDIS_URL=redis://redis:6379/0
    command: python -m bot
